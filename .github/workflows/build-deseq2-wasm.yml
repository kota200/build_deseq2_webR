name: Build DESeq2 webR library

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create R build script
        shell: bash
        run: |
          cat > build-deseq2.R <<'RSCRIPT'
          repo_dir <- "/work/wasm-repo"
          image_dir <- "/work/wasm-library"
          patch_dir <- "/work/biocparallel-patch"

          unlink(
            c(
              repo_dir,
              image_dir,
              patch_dir
            ),
            recursive = TRUE,
            force = TRUE
          )

          dir.create(
            repo_dir,
            recursive = TRUE,
            showWarnings = FALSE
          )

          dir.create(
            image_dir,
            recursive = TRUE,
            showWarnings = FALSE
          )

          dir.create(
            patch_dir,
            recursive = TRUE,
            showWarnings = FALSE
          )

          find_package_binary <- function(
            package_name
          ) {
            pattern <- paste0(
              "^",
              package_name,
              "_.*\\.tgz$"
            )

            package_files <- list.files(
              repo_dir,
              pattern = pattern,
              recursive = TRUE,
              full.names = TRUE
            )

            if (
              length(package_files) != 1L
            ) {
              stop(
                "Expected exactly one binary for ",
                package_name,
                ", but found ",
                length(package_files),
                ":\n",
                paste(
                  package_files,
                  collapse = "\n"
                )
              )
            }

            package_files[[1]]
          }

          # --------------------------------------------------
          # 1. locfit用のC17コンパイラ設定
          # --------------------------------------------------

          webr_vars <- system.file(
            "webr-vars.mk",
            package = "rwasm"
          )

          if (
            !nzchar(webr_vars) ||
            !file.exists(webr_vars)
          ) {
            stop(
              "rwasmのwebr-vars.mkが見つかりません。"
            )
          }

          makevars_lines <- readLines(
            webr_vars,
            warn = FALSE
          )

          has_cc17 <- any(
            grepl(
              "^[[:space:]]*CC17[[:space:]]*=",
              makevars_lines
            )
          )

          has_c17flags <- any(
            grepl(
              "^[[:space:]]*C17FLAGS[[:space:]]*=",
              makevars_lines
            )
          )

          if (!has_cc17) {
            cat(
              c(
                "",
                "# Added for locfit C17 compilation",
                "CC17 = emcc"
              ),
              file = webr_vars,
              sep = "\n",
              append = TRUE
            )
          }

          if (!has_c17flags) {
            cat(
              "C17FLAGS = -std=gnu17 $(WASM_COMMON_FLAGS)",
              file = webr_vars,
              sep = "\n",
              append = TRUE
            )
          }

          message(
            "Patched webR Makevars: ",
            webr_vars
          )

          message(
            "Last lines of webR Makevars:"
          )

          print(
            tail(
              readLines(
                webr_vars,
                warn = FALSE
              ),
              15
            )
          )

          # --------------------------------------------------
          # 2. DESeq2、locfit、依存関係をビルド
          # --------------------------------------------------

          message(
            "Building DESeq2, locfit, and dependencies..."
          )

          rwasm::add_pkg(
            packages = c(
              "locfit",
              "bioc::DESeq2"
            ),
            repo_dir = repo_dir,
            dependencies = NA,
            compress = TRUE
          )

          locfit_binary <- find_package_binary(
            "locfit"
          )

          deseq2_binary <- find_package_binary(
            "DESeq2"
          )

          biocparallel_binary <-
            find_package_binary(
              "BiocParallel"
            )

          message(
            "Confirmed locfit binary: ",
            locfit_binary
          )

          message(
            "Confirmed DESeq2 binary: ",
            deseq2_binary
          )

          message(
            "Original BiocParallel binary: ",
            biocparallel_binary
          )

          # --------------------------------------------------
          # 3. BiocParallel binaryを展開
          # --------------------------------------------------

          extraction_dir <- file.path(
            patch_dir,
            "extracted"
          )

          dir.create(
            extraction_dir,
            recursive = TRUE,
            showWarnings = FALSE
          )

          utils::untar(
            biocparallel_binary,
            exdir = extraction_dir
          )

          biocparallel_package_dir <-
            file.path(
              extraction_dir,
              "BiocParallel"
            )

          if (
            !dir.exists(
              biocparallel_package_dir
            )
          ) {
            stop(
              "BiocParallel binaryを展開できませんでした。\n",
              "Expected directory: ",
              biocparallel_package_dir
            )
          }

          description_path <- file.path(
            biocparallel_package_dir,
            "DESCRIPTION"
          )

          namespace_path <- file.path(
            biocparallel_package_dir,
            "NAMESPACE"
          )

          nsinfo_path <- file.path(
            biocparallel_package_dir,
            "Meta",
            "nsInfo.rds"
          )

          libs_path <- file.path(
            biocparallel_package_dir,
            "libs"
          )

          required_paths <- c(
            description_path,
            namespace_path,
            nsinfo_path
          )

          missing_paths <- required_paths[
            !file.exists(
              required_paths
            )
          ]

          if (
            length(missing_paths) > 0L
          ) {
            stop(
              "BiocParallel binaryに必要なファイルがありません:\n",
              paste(
                missing_paths,
                collapse = "\n"
              )
            )
          }

          description_data <- read.dcf(
            description_path
          )

          biocparallel_version <-
            unname(
              description_data[
                1,
                "Version"
              ]
            )

          message(
            "BiocParallel version: ",
            biocparallel_version
          )

          # --------------------------------------------------
          # 4. NAMESPACEからuseDynLibを削除
          # --------------------------------------------------

          namespace_lines <- readLines(
            namespace_path,
            warn = FALSE
          )

          original_dynlib_lines <-
            grep(
              "^[[:space:]]*useDynLib[[:space:]]*\\(",
              namespace_lines,
              value = TRUE
            )

          message(
            "Original useDynLib entries:"
          )

          print(
            original_dynlib_lines
          )

          namespace_lines <- namespace_lines[
            !grepl(
              "^[[:space:]]*useDynLib[[:space:]]*\\(",
              namespace_lines
            )
          ]

          writeLines(
            namespace_lines,
            namespace_path
          )

          if (
            any(
              grepl(
                "^[[:space:]]*useDynLib[[:space:]]*\\(",
                readLines(
                  namespace_path,
                  warn = FALSE
                )
              )
            )
          ) {
            stop(
              "BiocParallel NAMESPACEから",
              "useDynLibを削除できませんでした。"
            )
          }

          message(
            "Removed useDynLib from BiocParallel NAMESPACE."
          )

          # --------------------------------------------------
          # 5. Meta/nsInfo.rdsのdynamic library情報を削除
          # --------------------------------------------------

          ns_info <- readRDS(
            nsinfo_path
          )

          message(
            "Original nsInfo dynlibs:"
          )

          print(
            ns_info$dynlibs
          )

          message(
            "Original nsInfo nativeRoutines:"
          )

          print(
            ns_info$nativeRoutines
          )

          ns_info$dynlibs <-
            character()

          ns_info$nativeRoutines <-
            list()

          saveRDS(
            ns_info,
            nsinfo_path,
            version = 2
          )

          verified_ns_info <- readRDS(
            nsinfo_path
          )

          if (
            length(
              verified_ns_info$dynlibs
            ) != 0L
          ) {
            stop(
              "BiocParallel nsInfo.rdsのdynlibsを",
              "削除できませんでした。"
            )
          }

          if (
            length(
              verified_ns_info$nativeRoutines
            ) != 0L
          ) {
            stop(
              "BiocParallel nsInfo.rdsのnativeRoutinesを",
              "削除できませんでした。"
            )
          }

          message(
            "Removed dynlibs and nativeRoutines ",
            "from BiocParallel nsInfo.rds."
          )

          # --------------------------------------------------
          # 6. BiocParallelのネイティブライブラリを削除
          # --------------------------------------------------

          if (
            dir.exists(
              libs_path
            )
          ) {
            message(
              "Removing BiocParallel native library directory: ",
              libs_path
            )

            unlink(
              libs_path,
              recursive = TRUE,
              force = TRUE
            )
          }

          if (
            dir.exists(
              libs_path
            )
          ) {
            stop(
              "BiocParallel libs directoryを",
              "削除できませんでした。"
            )
          }

          # --------------------------------------------------
          # 7. BiocParallel tgzをserial-only版へ置換
          # --------------------------------------------------

          original_backup <- paste0(
            biocparallel_binary,
            ".native-backup"
          )

          if (
            file.exists(
              original_backup
            )
          ) {
            unlink(
              original_backup,
              force = TRUE
            )
          }

          rename_success <- file.rename(
            biocparallel_binary,
            original_backup
          )

          if (!rename_success) {
            stop(
              "Original BiocParallel binaryを",
              "バックアップできませんでした。"
            )
          }

          previous_working_directory <-
            getwd()

          tar_error <- NULL

          tryCatch(
            {
              setwd(
                extraction_dir
              )

              utils::tar(
                tarfile =
                  biocparallel_binary,
                files =
                  "BiocParallel",
                compression =
                  "gzip",
                tar =
                  "internal"
              )
            },
            error = function(error) {
              tar_error <<- error
            },
            finally = {
              setwd(
                previous_working_directory
              )
            }
          )

          if (
            !is.null(
              tar_error
            )
          ) {
            stop(
              "Patched BiocParallel binaryの作成に",
              "失敗しました: ",
              conditionMessage(
                tar_error
              )
            )
          }

          if (
            !file.exists(
              biocparallel_binary
            )
          ) {
            stop(
              "Patched BiocParallel binaryが",
              "作成されませんでした。"
            )
          }

          message(
            "Created serial-only BiocParallel binary: ",
            biocparallel_binary
          )

          # --------------------------------------------------
          # 8. 再作成したtgzを再展開して検証
          # --------------------------------------------------

          verification_dir <- file.path(
            patch_dir,
            "verification"
          )

          dir.create(
            verification_dir,
            recursive = TRUE,
            showWarnings = FALSE
          )

          utils::untar(
            biocparallel_binary,
            exdir = verification_dir
          )

          verified_package_dir <- file.path(
            verification_dir,
            "BiocParallel"
          )

          verified_namespace_path <-
            file.path(
              verified_package_dir,
              "NAMESPACE"
            )

          verified_nsinfo_path <-
            file.path(
              verified_package_dir,
              "Meta",
              "nsInfo.rds"
            )

          verified_libs_path <-
            file.path(
              verified_package_dir,
              "libs"
            )

          if (
            dir.exists(
              verified_libs_path
            )
          ) {
            stop(
              "Patched BiocParallelにlibs directoryが",
              "残っています。"
            )
          }

          verified_namespace_lines <-
            readLines(
              verified_namespace_path,
              warn = FALSE
            )

          if (
            any(
              grepl(
                "^[[:space:]]*useDynLib[[:space:]]*\\(",
                verified_namespace_lines
              )
            )
          ) {
            stop(
              "Patched BiocParallel NAMESPACEに",
              "useDynLibが残っています。"
            )
          }

          final_ns_info <- readRDS(
            verified_nsinfo_path
          )

          if (
            length(
              final_ns_info$dynlibs
            ) != 0L
          ) {
            stop(
              "Patched BiocParallel nsInfo.rdsに",
              "dynlibsが残っています。"
            )
          }

          if (
            length(
              final_ns_info$nativeRoutines
            ) != 0L
          ) {
            stop(
              "Patched BiocParallel nsInfo.rdsに",
              "nativeRoutinesが残っています。"
            )
          }

          message(
            "Serial-only BiocParallel verification passed."
          )

          unlink(
            original_backup,
            force = TRUE
          )

          # --------------------------------------------------
          # 9. ビルド済みpackage一覧を確認
          # --------------------------------------------------

          built_packages <- list.files(
            repo_dir,
            pattern = "\\.tgz$",
            recursive = TRUE,
            full.names = TRUE
          )

          message(
            "Built package files:"
          )

          print(
            sort(
              basename(
                built_packages
              )
            )
          )

          required_package_names <- c(
            "DESeq2",
            "locfit",
            "BiocParallel",
            "BiocGenerics",
            "S4Vectors",
            "IRanges",
            "XVector",
            "S4Arrays",
            "SparseArray",
            "DelayedArray",
            "Matrix",
            "MatrixGenerics",
            "Seqinfo",
            "GenomicRanges",
            "Biobase",
            "SummarizedExperiment",
            "matrixStats",
            "Rcpp",
            "RcppArmadillo",
            "ggplot2"
          )

          missing_package_binaries <-
            required_package_names[
              !vapply(
                required_package_names,
                function(package_name) {
                  any(
                    grepl(
                      paste0(
                        "^",
                        package_name,
                        "_.*\\.tgz$"
                      ),
                      basename(
                        built_packages
                      )
                    )
                  )
                },
                logical(1)
              )
            ]

          if (
            length(
              missing_package_binaries
            ) > 0L
          ) {
            stop(
              "Required package binaries are missing:\n",
              paste(
                missing_package_binaries,
                collapse = "\n"
              )
            )
          }

          # --------------------------------------------------
          # 10. filesystem imageを作成
          # --------------------------------------------------

          message(
            "Creating filesystem image..."
          )

          rwasm::make_vfs_library(
            out_dir = image_dir,
            out_name = "library.data",
            repo_dir = repo_dir,
            compress = TRUE,
            strip = c(
              "demo",
              "doc",
              "examples",
              "help",
              "html",
              "include",
              "tests",
              "testthat",
              "vignette",
              "vignettes"
            )
          )

          required_image_files <- c(
            file.path(
              image_dir,
              "library.data.gz"
            ),
            file.path(
              image_dir,
              "library.js.metadata"
            )
          )

          missing_image_files <-
            required_image_files[
              !file.exists(
                required_image_files
              )
            ]

          if (
            length(
              missing_image_files
            ) > 0L
          ) {
            stop(
              "Missing filesystem image files:\n",
              paste(
                missing_image_files,
                collapse = "\n"
              )
            )
          }

          build_information <- c(
            paste0(
              "Build date: ",
              Sys.time()
            ),
            paste0(
              "R version: ",
              R.version.string
            ),
            paste0(
              "DESeq2 binary: ",
              basename(
                deseq2_binary
              )
            ),
            paste0(
              "locfit binary: ",
              basename(
                locfit_binary
              )
            ),
            paste0(
              "BiocParallel binary: ",
              basename(
                biocparallel_binary
              )
            ),
            paste0(
              "BiocParallel version: ",
              biocparallel_version
            ),
            "BiocParallel mode: serial-only",
            "BiocParallel native libs: removed",
            "BiocParallel NAMESPACE useDynLib: removed",
            "BiocParallel Meta/nsInfo.rds dynlibs: removed"
          )

          writeLines(
            build_information,
            file.path(
              image_dir,
              "build-info.txt"
            )
          )

          message(
            "Filesystem image files:"
          )

          print(
            file.info(
              required_image_files
            )[
              ,
              c(
                "size",
                "mtime"
              ),
              drop = FALSE
            ]
          )

          message(
            "Build information:"
          )

          writeLines(
            build_information
          )

          message(
            "DESeq2 webR library build completed successfully."
          )
          RSCRIPT

      - name: Build DESeq2 and dependencies
        shell: bash
        run: |
          docker run --rm \
            --entrypoint /bin/bash \
            -e GITHUB_TOKEN="${{ github.token }}" \
            -e GITHUB_PAT="${{ github.token }}" \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            ghcr.io/r-wasm/webr:v0.6.0 \
            -lc '
              set -euo pipefail

              echo "Installing patched pkgdepends..."

              R -q -e '"'"'
                pak::pak(
                  "r-lib/pkgdepends@v0.9.0-patched",
                  lib = .Library,
                  ask = FALSE
                )
              '"'"'

              echo
              echo "Build environment:"

              R -q -e '"'"'
                cat(
                  "R: ",
                  R.version.string,
                  "\n"
                )

                cat(
                  "rwasm: ",
                  as.character(
                    packageVersion("rwasm")
                  ),
                  "\n"
                )

                cat(
                  "pkgdepends: ",
                  as.character(
                    packageVersion("pkgdepends")
                  ),
                  "\n"
                )
              '"'"'

              echo
              echo "Starting DESeq2 build..."

              Rscript /work/build-deseq2.R
            '

      - name: Inspect built packages and image
        shell: bash
        run: |
          set -euo pipefail

          echo "Generated filesystem image files:"

          find wasm-library \
            -maxdepth 1 \
            -type f \
            -printf '%f %s bytes\n' \
            | sort

          echo
          echo "Built package binaries:"

          find wasm-repo \
            -type f \
            -name '*.tgz' \
            -printf '%f\n' \
            | sort

          echo
          echo "Checking required image files:"

          test -s \
            wasm-library/library.data.gz

          test -s \
            wasm-library/library.js.metadata

          echo "Found library.data.gz"
          echo "Found library.js.metadata"

          echo
          echo "Checking locfit:"

          LOCFIT_FILE="$(
            find wasm-repo \
              -type f \
              -name 'locfit_*.tgz' \
              -print \
              -quit
          )"

          if [ -z "${LOCFIT_FILE}" ]; then
            echo "ERROR: locfit was not built"
            exit 1
          fi

          echo "Found: ${LOCFIT_FILE}"

          echo
          echo "Checking DESeq2:"

          DESEQ2_FILE="$(
            find wasm-repo \
              -type f \
              -name 'DESeq2_*.tgz' \
              -print \
              -quit
          )"

          if [ -z "${DESEQ2_FILE}" ]; then
            echo "ERROR: DESeq2 was not built"
            exit 1
          fi

          echo "Found: ${DESEQ2_FILE}"

          echo
          echo "Checking serial-only BiocParallel:"

          BIOCPARALLEL_FILE="$(
            find wasm-repo \
              -type f \
              -name 'BiocParallel_*.tgz' \
              -print \
              -quit
          )"

          if [ -z "${BIOCPARALLEL_FILE}" ]; then
            echo "ERROR: BiocParallel was not built"
            exit 1
          fi

          echo "Found: ${BIOCPARALLEL_FILE}"

          if \
            tar -tzf "${BIOCPARALLEL_FILE}" \
              | grep -q '^BiocParallel/libs/'
          then
            echo \
              "ERROR: BiocParallel native libs are still present"
            exit 1
          fi

          echo \
            "OK: BiocParallel native libs are absent"

          if \
            tar -xOzf \
              "${BIOCPARALLEL_FILE}" \
              BiocParallel/NAMESPACE \
              | grep -q 'useDynLib'
          then
            echo \
              "ERROR: BiocParallel NAMESPACE still contains useDynLib"
            exit 1
          fi

          echo \
            "OK: BiocParallel NAMESPACE has no useDynLib"

          echo
          echo "Build information:"

          cat \
            wasm-library/build-info.txt

      - name: Upload filesystem image
        uses: actions/upload-artifact@v6
        with:
          name: deseq2-webr-library-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            wasm-library/library.data.gz
            wasm-library/library.js.metadata
            wasm-library/build-info.txt
          if-no-files-found: error
          retention-days: 14
