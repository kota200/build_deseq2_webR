name: Build DESeq2 webR library

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create R build script
        run: |
          cat > build-deseq2.R <<'RSCRIPT'
          repo_dir <- "/work/wasm-repo"
          image_dir <- "/work/wasm-library"

          unlink(
            c(repo_dir, image_dir),
            recursive = TRUE,
            force = TRUE
          )

          dir.create(
            repo_dir,
            recursive = TRUE,
            showWarnings = FALSE
          )

          dir.create(
            image_dir,
            recursive = TRUE,
            showWarnings = FALSE
          )

          message(
            "Building DESeq2, locfit, and dependencies..."
          )

          rwasm::add_pkg(
            packages = c(
              "locfit",
              "bioc::DESeq2"
            ),
            repo_dir = repo_dir,
            dependencies = NA,
            compress = TRUE
          )

          message(
            "Creating filesystem image..."
          )

          rwasm::make_vfs_library(
            out_dir = image_dir,
            out_name = "library.data",
            repo_dir = repo_dir,
            compress = TRUE,
            strip = c(
              "demo",
              "doc",
              "examples",
              "help",
              "html",
              "include",
              "tests",
              "vignette"
            )
          )

          message("Filesystem image files:")

          print(
            list.files(
              image_dir,
              full.names = TRUE
            )
          )
          RSCRIPT

      - name: Build DESeq2 and dependencies
        run: |
          docker run --rm \
            --entrypoint /bin/bash \
            -e GITHUB_TOKEN="${{ github.token }}" \
            -e GITHUB_PAT="${{ github.token }}" \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            ghcr.io/r-wasm/webr:v0.6.0 \
            -lc '
              set -euo pipefail

              R -q -e '"'"'
                pak::pak(
                  "r-lib/pkgdepends@v0.9.0-patched",
                  lib = .Library
                )
              '"'"'

              R -q -e '"'"'
                cat(R.version.string, "\n")
                cat(
                  "rwasm: ",
                  as.character(packageVersion("rwasm")),
                  "\n"
                )
                cat(
                  "pkgdepends: ",
                  as.character(packageVersion("pkgdepends")),
                  "\n"
                )
              '"'"'

              Rscript /work/build-deseq2.R
            '

      - name: Inspect filesystem image
        run: |
          echo "Generated files:"

          find wasm-library \
            -maxdepth 1 \
            -type f \
            -printf '%f %s bytes\n'

          echo
          echo "Built packages:"

          find wasm-repo/bin/emscripten/contrib \
            -type f \
            -name '*.tgz' \
            -printf '%f\n' \
            | sort

          echo
          echo "Checking essential packages:"

          find wasm-repo/bin/emscripten/contrib \
            -type f \
            \( \
              -name 'DESeq2_*.tgz' \
              -o -name 'locfit_*.tgz' \
              -o -name 'Rcpp_*.tgz' \
              -o -name 'RcppArmadillo_*.tgz' \
            \) \
            -printf '%f\n'

      - name: Upload filesystem image
        uses: actions/upload-artifact@v6
        with:
          name: deseq2-webr-library-${{ github.run_attempt }}
          path: wasm-library/
          if-no-files-found: error
