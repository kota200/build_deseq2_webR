name: Build DESeq2 webR library

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create R build script
        run: |
          cat > build-deseq2.R <<'RSCRIPT'
          repo_dir <- "/work/wasm-repo"
          image_dir <- "/work/wasm-library"

          dir.create(
            repo_dir,
            recursive = TRUE,
            showWarnings = FALSE
          )

          dir.create(
            image_dir,
            recursive = TRUE,
            showWarnings = FALSE
          )

          message(
            "Building DESeq2, locfit, and dependencies..."
          )

          rwasm::add_pkg(
            packages = c(
              "locfit",
              "bioc::DESeq2"
            ),
            repo_dir = repo_dir,
            dependencies = NA,
            compress = TRUE
          )

          message(
            "Creating filesystem image..."
          )

          rwasm::make_vfs_library(
            out_dir = image_dir,
            out_name = "library.data",
            repo_dir = repo_dir,
            compress = TRUE,
            strip = c(
              "demo",
              "doc",
              "examples",
              "help",
              "html",
              "include",
              "tests",
              "vignette"
            )
          )

          message("Filesystem image files:")

          print(
            list.files(
              image_dir,
              full.names = TRUE
            )
          )
          RSCRIPT

      - name: Build DESeq2 and dependencies
        run: |
          docker run --rm \
            -e GITHUB_TOKEN="${{ github.token }}" \
            -e GITHUB_PAT="${{ github.token }}" \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            ghcr.io/r-wasm/webr:main \
            Rscript /work/build-deseq2.R

      - name: Inspect built packages
        run: |
          echo "Built packages:"

          find wasm-repo/bin/emscripten/contrib \
            -type f \
            -name '*.tgz' \
            -printf '%f\n' \
            | sort

          echo
          echo "Checking locfit:"

          find wasm-repo/bin/emscripten/contrib \
            -type f \
            -name 'locfit_*.tgz' \
            -print

      - name: Upload filesystem image
        uses: actions/upload-artifact@v6
        with:
          name: deseq2-webr-library
          path: wasm-library/
          if-no-files-found: error

      - name: Inspect filesystem image
        run: |
          echo "Generated files:"
          find wasm-library -maxdepth 1 -type f \
            -printf '%f %s bytes\n'

          echo
          echo "Built packages:"
          find wasm-repo/bin/emscripten/contrib \
            -type f \
            -name '*.tgz' \
            -printf '%f\n' \
            | sort

      - name: Upload filesystem image
        uses: actions/upload-artifact@v6
        with:
          name: deseq2-webr-library
          path: wasm-library/
          if-no-files-found: error
