name: Build DESeq2 webR library

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create build scripts
        run: |
          cat > build-deseq2.R <<'RSCRIPT'
          repo_dir <- "/work/wasm-repo"
          image_dir <- "/work/wasm-library"

          unlink(
            c(repo_dir, image_dir),
            recursive = TRUE,
            force = TRUE
          )

          dir.create(
            repo_dir,
            recursive = TRUE,
            showWarnings = FALSE
          )

          dir.create(
            image_dir,
            recursive = TRUE,
            showWarnings = FALSE
          )

          message("Building locfit...")

          rwasm::add_pkg(
            packages = "locfit",
            repo_dir = repo_dir,
            dependencies = NA,
            compress = TRUE
          )

          locfit_files <- list.files(
            repo_dir,
            pattern = "^locfit_.*\\.tgz$",
            recursive = TRUE,
            full.names = TRUE
          )

          if (length(locfit_files) == 0L) {
            stop(
              "locfit was not built. ",
              "Aborting filesystem image creation."
            )
          }

          message("Built locfit:")
          print(locfit_files)

          message(
            "Building DESeq2 and hard dependencies..."
          )

          rwasm::add_pkg(
            packages = "bioc::DESeq2",
            repo_dir = repo_dir,
            dependencies = NA,
            compress = TRUE
          )

          deseq2_files <- list.files(
            repo_dir,
            pattern = "^DESeq2_.*\\.tgz$",
            recursive = TRUE,
            full.names = TRUE
          )

          if (length(deseq2_files) == 0L) {
            stop(
              "DESeq2 was not built. ",
              "Aborting filesystem image creation."
            )
          }

          message("Built DESeq2:")
          print(deseq2_files)

          message("All built packages:")

          built_packages <- list.files(
            repo_dir,
            pattern = "\\.tgz$",
            recursive = TRUE,
            full.names = FALSE
          )

          print(sort(built_packages))

          message("Creating filesystem image...")

          rwasm::make_vfs_library(
            out_dir = image_dir,
            out_name = "library.data",
            repo_dir = repo_dir,
            compress = TRUE,
            strip = c(
              "demo",
              "doc",
              "examples",
              "help",
              "html",
              "include",
              "tests",
              "vignette"
            )
          )

          image_files <- list.files(
            image_dir,
            full.names = TRUE
          )

          message("Filesystem image files:")
          print(image_files)

          if (
            !file.exists(
              file.path(
                image_dir,
                "library.data.gz"
              )
            )
          ) {
            stop(
              "library.data.gz was not created."
            )
          }

          if (
            !file.exists(
              file.path(
                image_dir,
                "library.js.metadata"
              )
            )
          ) {
            stop(
              "library.js.metadata was not created."
            )
          }
          RSCRIPT

          cat > run-build.sh <<'BUILDSCRIPT'
          #!/usr/bin/env bash

          set -euo pipefail

          echo "Installing patched pkgdepends..."

          R -q -e '
            pak::pak(
              "r-lib/pkgdepends@v0.9.0-patched",
              lib = .Library,
              ask = FALSE
            )
          '

          echo "Build environment:"

          R -q -e '
            cat(
              "R: ",
              R.version.string,
              "\n"
            )

            cat(
              "rwasm: ",
              as.character(
                packageVersion("rwasm")
              ),
              "\n"
            )

            cat(
              "pkgdepends: ",
              as.character(
                packageVersion("pkgdepends")
              ),
              "\n"
            )
          '

          Rscript /work/build-deseq2.R
          BUILDSCRIPT

          chmod +x run-build.sh

      - name: Build DESeq2 and dependencies
        run: |
          docker run --rm \
            --entrypoint /bin/bash \
            -e GITHUB_TOKEN="${{ github.token }}" \
            -e GITHUB_PAT="${{ github.token }}" \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            ghcr.io/r-wasm/webr:v0.6.0 \
            /work/run-build.sh

      - name: Inspect built packages
        run: |
          set -euo pipefail

          echo "Generated image files:"

          find wasm-library \
            -maxdepth 1 \
            -type f \
            -printf '%f %s bytes\n'

          echo
          echo "Built packages:"

          find wasm-repo \
            -type f \
            -name '*.tgz' \
            -printf '%f\n' \
            | sort

          echo
          echo "Checking locfit:"

          LOCFIT_FILE="$(
            find wasm-repo \
              -type f \
              -name 'locfit_*.tgz' \
              -print \
              -quit
          )"

          if [ -z "${LOCFIT_FILE}" ]; then
            echo "ERROR: locfit was not built"
            exit 1
          fi

          echo "Found: ${LOCFIT_FILE}"

          echo
          echo "Checking DESeq2:"

          DESEQ2_FILE="$(
            find wasm-repo \
              -type f \
              -name 'DESeq2_*.tgz' \
              -print \
              -quit
          )"

          if [ -z "${DESEQ2_FILE}" ]; then
            echo "ERROR: DESeq2 was not built"
            exit 1
          fi

          echo "Found: ${DESEQ2_FILE}"

      - name: Upload filesystem image
        uses: actions/upload-artifact@v6
        with:
          name: deseq2-webr-library-${{ github.run_id }}-${{ github.run_attempt }}
          path: wasm-library/
          if-no-files-found: error
