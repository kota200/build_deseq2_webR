name: Build DESeq2 webR library

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create R build script
        run: |
          cat > build-deseq2.R <<'RSCRIPT'
          repo_dir <- "/work/wasm-repo"
          image_dir <- "/work/wasm-library"

          unlink(
            c(repo_dir, image_dir),
            recursive = TRUE,
            force = TRUE
          )

          dir.create(
            repo_dir,
            recursive = TRUE,
            showWarnings = FALSE
          )

          dir.create(
            image_dir,
            recursive = TRUE,
            showWarnings = FALSE
          )

          # --------------------------------------------------
          # locfit用のC17コンパイラ設定をrwasmへ追加
          # --------------------------------------------------

          webr_vars <- system.file(
            "webr-vars.mk",
            package = "rwasm"
          )

          if (
            !nzchar(webr_vars) ||
            !file.exists(webr_vars)
          ) {
            stop(
              "rwasmのwebr-vars.mkが見つかりません。"
            )
          }

          current_makevars <- readLines(
            webr_vars,
            warn = FALSE
          )

          if (
            !any(
              grepl(
                "^CC17[[:space:]]*=",
                current_makevars
              )
            )
          ) {
            cat(
              c(
                "",
                "# Added for locfit C17 compilation",
                "CC17 = emcc",
                "C17FLAGS = -std=gnu17 $(WASM_COMMON_FLAGS)"
              ),
              file = webr_vars,
              sep = "\n",
              append = TRUE
            )
          }

          message(
            "Patched webR Makevars: ",
            webr_vars
          )

          message(
            "Last lines of patched Makevars:"
          )

          patched_makevars <- readLines(
            webr_vars,
            warn = FALSE
          )

          print(
            tail(
              patched_makevars,
              10
            )
          )

          # --------------------------------------------------
          # DESeq2、locfit、ハード依存関係をビルド
          # --------------------------------------------------

          message(
            "Building DESeq2, locfit, and dependencies..."
          )

          rwasm::add_pkg(
            packages = c(
              "locfit",
              "bioc::DESeq2"
            ),
            repo_dir = repo_dir,
            dependencies = NA,
            compress = TRUE
          )

          # --------------------------------------------------
          # ビルド結果を確認
          # --------------------------------------------------

          built_packages <- list.files(
            repo_dir,
            pattern = "\\.tgz$",
            recursive = TRUE,
            full.names = TRUE
          )

          message("Built package files:")

          print(
            sort(
              basename(
                built_packages
              )
            )
          )

          locfit_files <- built_packages[
            grepl(
              "/locfit_[^/]+\\.tgz$",
              built_packages
            )
          ]

          deseq2_files <- built_packages[
            grepl(
              "/DESeq2_[^/]+\\.tgz$",
              built_packages
            )
          ]

          if (
            length(locfit_files) == 0L
          ) {
            stop(
              "locfit was not built even after applying ",
              "the C17 compiler configuration."
            )
          }

          if (
            length(deseq2_files) == 0L
          ) {
            stop(
              "DESeq2 was not built."
            )
          }

          message("Confirmed locfit:")
          print(locfit_files)

          message("Confirmed DESeq2:")
          print(deseq2_files)

          # --------------------------------------------------
          # filesystem imageを作成
          # --------------------------------------------------

          message(
            "Creating filesystem image..."
          )

          rwasm::make_vfs_library(
            out_dir = image_dir,
            out_name = "library.data",
            repo_dir = repo_dir,
            compress = TRUE,
            strip = c(
              "demo",
              "doc",
              "examples",
              "help",
              "html",
              "include",
              "tests",
              "testthat",
              "vignette",
              "vignettes"
            )
          )

          required_image_files <- c(
            file.path(
              image_dir,
              "library.data.gz"
            ),
            file.path(
              image_dir,
              "library.js.metadata"
            )
          )

          missing_image_files <-
            required_image_files[
              !file.exists(
                required_image_files
              )
            ]

          if (
            length(missing_image_files) > 0L
          ) {
            stop(
              "Missing filesystem image files: ",
              paste(
                missing_image_files,
                collapse = ", "
              )
            )
          }

          message(
            "Filesystem image files:"
          )

          print(
            file.info(
              required_image_files
            )[
              ,
              c(
                "size",
                "mtime"
              ),
              drop = FALSE
            ]
          )
          RSCRIPT

      - name: Build DESeq2 and dependencies
        run: |
          docker run --rm \
            --entrypoint /bin/bash \
            -e GITHUB_TOKEN="${{ github.token }}" \
            -e GITHUB_PAT="${{ github.token }}" \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            ghcr.io/r-wasm/webr:v0.6.0 \
            -lc '
              set -euo pipefail

              echo "Installing patched pkgdepends..."

              R -q -e '"'"'
                pak::pak(
                  "r-lib/pkgdepends@v0.9.0-patched",
                  lib = .Library,
                  ask = FALSE
                )
              '"'"'

              echo "Build environment:"

              R -q -e '"'"'
                cat(
                  "R: ",
                  R.version.string,
                  "\n"
                )

                cat(
                  "rwasm: ",
                  as.character(
                    packageVersion("rwasm")
                  ),
                  "\n"
                )

                cat(
                  "pkgdepends: ",
                  as.character(
                    packageVersion("pkgdepends")
                  ),
                  "\n"
                )
              '"'"'

              Rscript /work/build-deseq2.R
            '

      - name: Inspect filesystem image
        run: |
          set -euo pipefail

          echo "Generated files:"

          find wasm-library \
            -maxdepth 1 \
            -type f \
            -printf '%f %s bytes\n'

          echo
          echo "Checking locfit:"

          LOCFIT_FILE="$(
            find wasm-repo \
              -type f \
              -name 'locfit_*.tgz' \
              -print \
              -quit
          )"

          if [ -z "${LOCFIT_FILE}" ]; then
            echo "ERROR: locfit was not built"
            exit 1
          fi

          echo "Found: ${LOCFIT_FILE}"

          echo
          echo "Checking DESeq2:"

          DESEQ2_FILE="$(
            find wasm-repo \
              -type f \
              -name 'DESeq2_*.tgz' \
              -print \
              -quit
          )"

          if [ -z "${DESEQ2_FILE}" ]; then
            echo "ERROR: DESeq2 was not built"
            exit 1
          fi

          echo "Found: ${DESEQ2_FILE}"

      - name: Upload filesystem image
        uses: actions/upload-artifact@v6
        with:
          name: deseq2-webr-library-${{ github.run_id }}-${{ github.run_attempt }}
          path: wasm-library/
          if-no-files-found: error
