<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>webR DESeq2 test</title>
  <style>
    body {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
      font-family: system-ui, sans-serif;
      line-height: 1.6;
    }
    button {
      padding: 10px 16px;
      font: inherit;
      cursor: pointer;
    }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      padding: 16px;
      background: #f4f4f4;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h1>webR + DESeq2 test</h1>
  <p>
    さくら上のwebRと、ローカルに配置したDESeq2 filesystem imageを使って、
    100遺伝子・6サンプルのテスト解析を実行します。
  </p>

  <button id="run" type="button">Run DESeq2</button>
  <pre id="output">Not started</pre>

  <script type="module">
    const button = document.getElementById("run");
    const output = document.getElementById("output");
    const decoder = new TextDecoder();

    button.addEventListener("click", async () => {
      button.disabled = true;

      try {
        output.textContent = "Loading webR...";

        const baseUrl = new URL("./webr/", window.location.href).href;
        const libraryUrl = new URL(
          "./library/library.data",
          window.location.href
        ).href;

        const {
          WebR,
          ChannelType
        } = await import(new URL("webr.js", baseUrl).href);

        const webR = new WebR({
          baseUrl,
          channelType: ChannelType.PostMessage
        });

        await webR.init();

        output.textContent =
          "Mounting DESeq2 library...\n" +
          libraryUrl;

        await webR.evalRVoid(`
          webr::mount(
            mountpoint = "/deseq2-library",
            source = ${JSON.stringify(libraryUrl)}
          )

          .libPaths(c(
            "/deseq2-library",
            .libPaths()
          ))

          suppressPackageStartupMessages(
            library(DESeq2)
          )
        `);

        output.textContent =
          "DESeq2 loaded. Running test analysis...";

        await webR.evalRVoid(`
          set.seed(123)

          number_of_genes <- 100L
          number_of_samples <- 6L

          condition <- factor(
            c(
              "control", "control", "control",
              "treatment", "treatment", "treatment"
            ),
            levels = c("control", "treatment")
          )

          col_data <- data.frame(
            condition = condition,
            row.names = paste0("sample_", seq_len(number_of_samples))
          )

          base_means <- 2^runif(
            number_of_genes,
            min = 4,
            max = 10
          )

          expected_means <- matrix(
            rep(base_means, number_of_samples),
            nrow = number_of_genes,
            ncol = number_of_samples
          )

          expected_means[1:10, 4:6] <-
            expected_means[1:10, 4:6] * 4

          count_matrix <- matrix(
            rnbinom(
              number_of_genes * number_of_samples,
              mu = as.vector(expected_means),
              size = 20
            ),
            nrow = number_of_genes,
            ncol = number_of_samples,
            dimnames = list(
              paste0("gene_", seq_len(number_of_genes)),
              rownames(col_data)
            )
          )

          dds <- DESeqDataSetFromMatrix(
            countData = count_matrix,
            colData = col_data,
            design = ~ condition
          )

          dds <- DESeq(dds, quiet = TRUE)

          result <- results(
            dds,
            contrast = c(
              "condition",
              "treatment",
              "control"
            )
          )

          result_table <- data.frame(
            gene_id = rownames(result),
            as.data.frame(result),
            check.names = FALSE
          )

          result_table <- result_table[
            order(result_table$pvalue),
            ,
            drop = FALSE
          ]

          write.csv(
            head(result_table, 20),
            "/tmp/deseq2_test_results.csv",
            row.names = FALSE,
            na = ""
          )
        `);

        const bytes = await webR.FS.readFile(
          "/tmp/deseq2_test_results.csv"
        );

        output.textContent =
          "SUCCESS: DESeq2 ran in the browser.\n\n" +
          decoder.decode(bytes);
      } catch (error) {
        console.error(error);
        output.textContent =
          "ERROR:\n" +
          (error?.stack || error?.message || String(error));
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
